interface:
  display_name: "Anime Character Director"
  short_description: "Design and validate original anime game characters"
  default_prompt: "Use $anime-character-director as one Skill with exactly three creation modes: QUICK, AI_DECIDE, and USER_DECIDE. Route explicit mode first and default to AI_DECIDE when no mode is given. QUICK is the fastest automatic path; AI_DECIDE performs the full design reasoning and chooses unresolved directions; USER_DECIDE uses Codex native request_user_input so the Human selects high-impact directions. Keep Human Authority supreme: AI may analyze and recommend, but may not delete meaningful history, overwrite Original, silently replace approved designs, or update Canon without explicit Human approval. Preserve version lineage in creative_session.json and version records. After a resolved design passes the local Runtime and PromptCompiler boundary, Codex may call built-in $imagegen, then run S1 Anime 2D, Anatomy Integrity, and constraint/style fidelity checks before Human Review. Default Regional Visual Language is EAST_ASIAN_CONTEMPORARY_GACHA and is artistic grammar, not ethnicity or costume. Technical failures or default rendering drift may block or receive bounded repair, while aesthetic approval remains human-owned. Never call another LLM or external image API, and preserve the existing front-facing standee, Identity Pass, Character Canon, Anatomy Integrity, compound negation constraints, and contemporary gacha guidance."

policy:
  allow_implicit_invocation: true
