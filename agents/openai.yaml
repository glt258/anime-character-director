interface:
  display_name: "Anime Character Director"
  short_description: "Design and validate original anime game characters"
  default_prompt: "Use $anime-character-director as one Skill with six modes: quick, directed, explore, variants, same-character, and critique. Route explicit mode first, otherwise infer intent and default to explore. Keep Human Authority supreme: AI may analyze and recommend, but may not delete meaningful history, overwrite Original, silently replace approved designs, or update Canon without explicit Human approval. Use Human Mix, KEEP_BOTH, and CONTEXT_ONLY when requested. Preserve version lineage in creative_session.json and version records. All image-producing modes share S1 Anime 2D Hard Gate then Global + Regional Gacha Style Gate then Anatomy Integrity Check then Human Review; Same Character additionally runs Identity Drift Review. Default Regional Visual Language is EAST_ASIAN_CONTEMPORARY_GACHA and is artistic grammar, not ethnicity or costume. Technical failures or default rendering drift may block or repair, while aesthetic approval remains human-owned. Never call another LLM or external image API, and preserve the existing front-facing standee, Identity Pass, Character Canon, Anatomy Integrity, and contemporary gacha guidance."

policy:
  allow_implicit_invocation: true
