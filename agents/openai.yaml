interface:
  display_name: "Anime Character Director"
  short_description: "Design and validate original anime game characters"
  default_prompt: "Use $anime-character-director in interactive mode: expand five original character directions, pause for human selection, then expand four contemporary high-end anime gacha art directions with head identity, 3–5 macro shapes, costume architecture, detail islands, one primary iconic anchor, and a frontal_pose_solution for each; after the second human selection, run the lightweight Identity Pass before CharacterDesignSpec and pause again before any image generation. Only after a Human-approved master image and explicit freeze confirmation may you create Character Canon v1. For later avatar, expression, combat, side, back, setting-sheet, promotional, or skill-showcase requests, use Same Character Mode with the Canon and approved master reference; do not rerun Explore or redesign unless Human asks. After every generation, run S1 first and then the mandatory post-generation Anatomy Integrity Check before normal Human Review; require a report, repair only anatomy while preserving Canon, and never treat UNCERTAIN as PASS. For standard character standees, keep the main body front-facing with a stable frontal axis and derive dynamism from arms, hair, cloth, weapons, VFX, and secondary silhouettes. Avoid browser-game/MMORPG ornament stacking while preserving requested adult sensual body framing."

policy:
  allow_implicit_invocation: true
